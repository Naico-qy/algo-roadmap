name: 部署训练站

# 纯静态站：无需构建，直接发布。
# 前提：本仓库根目录 = algo-roadmap 目录（把该文件夹单独建仓即可）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 自检（确保页面与数据都在）
        run: |
          test -f index.html
          test -f data/curriculum.json
          test -f assets/app.js
          test -f assets/chat.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
